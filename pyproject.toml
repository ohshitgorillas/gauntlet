[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "gauntlet"
version = "0.0.0"
requires-python = ">=3.12"

[project.scripts]
gauntlet = "gauntlet.seams.cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pyright[nodejs]",
    "pytest",
    "ruff",
]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_expr = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
    "unused-ignore",
]
python_version = "3.12"
explicit_package_bases = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["TID251", "E902"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "narrow the type in the code instead"
"typing_extensions.cast".msg = "narrow the type in the code instead"
