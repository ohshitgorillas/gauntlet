# Tooling configuration for this repository.
#
# There is no package here to build. The hooks and scripts are copied into a
# consumer's tree rather than installed, so this file configures the tools the
# gate runner invokes and declares nothing else.

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".claude/worktrees", ".venv", "state"]

[tool.ruff.lint]
# BLE and TRY are load-bearing rather than taste. A lane hook decides whether a
# tool call is allowed; an exception it swallows is a call it waved through, so
# a bare `except` in this tree is a lane that fails open.
select = [
    "E", "F", "B", "SIM", "UP", "RET", "ARG", "PTH", "C901", "BLE", "TRY", "I",
    # A subprocess whose exit status nobody reads is the same fail-open shape
    # as a swallowed exception, and `shell=True` hands a hook's argument to a
    # second parser the hook never sees.
    "PLW1510", "S602",
    # A shebang on a file nobody can execute is a lie about how it is run.
    "EXE",
    # An import inside a function hides a dependency until the call.
    "PLC0415",
    # pytest shapes: a fixture that yields nothing, a bare `assert x == x`.
    "PT",
]
# Two of `TRY` are off because they cut against the reason `TRY` is on. TRY003
# wants the message moved inside a subclass; the messages here name the tool
# that is missing or the shape the judge answered with, and a subclass per
# message buys a reader nothing. TRY004 wants a `TypeError` where a value has
# the wrong type, but the wrong types in this tree come from a subprocess whose
# output is parsed, and a gate catches `RuntimeError` to turn exactly those into
# one clean gate line -- a `TypeError` there escapes the handler and prints a
# traceback instead.
ignore = ["TRY003", "TRY004"]

[tool.ruff.lint.per-file-ignores]
# A test module is not a package, and a test body imports what it patches.
"tests/*" = ["PLC0415"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.black]
line-length = 100

[tool.vulture]
# Dead code in a lane hook is worse than dead code elsewhere: a helper nobody
# calls reads as a guard that is in force. The scope is `hooks` and `scripts`,
# the same two directories `mypy` holds, because `tests/` names its own copies
# of kit constants and a pytest class looks unreferenced from the outside.
paths = ["hooks", "scripts"]
exclude = [".claude/worktrees", ".venv", "state"]
min_confidence = 60

[tool.mypy]
strict = true
# The hooks and scripts import their shared modules from `hooks/lib`, and those
# travel as a unit with no package around them, so the directory itself is the
# import path.
mypy_path = "hooks/lib"
exclude = ['^\.claude/worktrees/', '^\.venv/']

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["hooks", "scripts"]
omit = ["*/__pycache__/*", ".claude/worktrees/*"]
# The suite drives most of this kit as a subprocess, so the tracer has to follow
# one or the figure measures the wrappers and not the work. `parallel` gives each
# process its own data file; `scripts/coverage_subprocess/sitecustomize.py` starts
# the tracer in it, and `check-gates.sh` combines them before it reports.
parallel = true

[tool.coverage.report]
# The floor is the measured figure rounded down, raised as the suite grows.
# The tracer follows a subprocess now, so the figure counts the gates and hooks
# the suite drives rather than only the wrappers around them. What it still
# understates is anything the suite runs under a bare `python3` rather than the
# venv's, which has no tracer to start -- every gate script and every hook whose
# bar is its own `--self-test` is measured at zero here for that reason, and
# each one that lands moves the figure down while adding a bar.
fail_under = 41
skip_covered = false

[tool.coverage.json]
output = ".coverage.json"
show_contexts = false
