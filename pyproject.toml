[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "gauntlet"
version = "0.0.0"
requires-python = ">=3.12"

[project.scripts]
gauntlet = "gauntlet.seams.cli:main"

[dependency-groups]
dev = [
    "defusedxml==0.7.1",
    "mypy",
    "pre-commit",
    "pyright[nodejs]",
    "pytest",
    "pytest-randomly",
    "pytest-timeout",
    "ruff",
    "types-defusedxml==0.7.0.20260504",
]

[tool.mypy]
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_expr = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
    "unused-ignore",
]
python_version = "3.12"
explicit_package_bases = true

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true
timeout = 30

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C901", # Complexity counts do not establish code quality.
    "E501", # Line length is handled by the formatter.
    "W505", # Documentation line length is not capped.
    "PLR0911", # Return counts do not establish code quality.
    "PLR0912", # Branch counts do not establish code quality.
    "PLR0913", # Argument counts do not establish code quality.
    "PLR0915", # Statement counts do not establish code quality.
    "PLR0917", # Positional argument counts do not establish code quality.
    "D203", # D211 requires no blank line before class docstrings.
    "D213", # D212 puts the summary on the first docstring line.
    "COM812", # The formatter handles trailing commas.
    "ISC001", # The formatter handles implicit string concatenation.
    "S603", # Process arguments are checked by the code and its tests.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.cast".msg = "narrow the type in the code instead"
"typing_extensions.cast".msg = "narrow the type in the code instead"
