repos:
  - repo: local
    hooks:
      - id: make-check
        name: make check
        entry: uv run python -m gates.heavy make check
        language: unsupported
        pass_filenames: false
        files: '(\.pyi?$|^(pyproject\.toml|uv\.lock|Makefile|\.pre-commit-config\.yaml|\.gitignore|\.python-version)$|^(gates|tests)/)'
